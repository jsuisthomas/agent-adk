apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-adk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jsuisthomas/agent-adk.git
    targetRevision: develop  
    path: kube  # Chemin vers les manifests Kubernetes
  destination:
    server: https://kubernetes.default.svc  
    namespace: agents
  syncPolicy:
    automated:
      prune: true  # Supprime les ressources supprimées du Git
      selfHeal: true  # Corrige les écarts entre Git et le cluster
    syncOptions:
      - CreateNamespace=false  