[project]
name = "agent-adk"
version = "0.1.0"
description = "Google ADK agent demo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "certifi>=2026.7.22",
    "dotenv>=0.9.9",
    "google-adk>=2.8.0",
    "langfuse>=4.14.1",
    "litellm>=1.75.0",
    "openlit>=1.34.7",
    "opentelemetry-exporter-otlp-proto-http>=1.42.0,<1.43.0",
    "opentelemetry-instrumentation-system-metrics>=0.63b0,<0.64b0",
    "opentelemetry-sdk>=1.42.0,<1.43.0",
    "pyroscope-io>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_adk"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

