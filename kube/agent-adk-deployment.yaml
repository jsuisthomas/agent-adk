apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-adk

spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      containers:
      - name: agent-adk
        image: agentadk:0.1.1
        imagePullPolicy: IfNotPresent
        stdin: true
        tty: true
        envFrom:
        - secretRef:
            name: agent-adk-secrets
      